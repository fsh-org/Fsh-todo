  <body>
    <a href="https://fsh.plus">
      <table class="title">
        <tr>
          <td><video src="https://fsh.plus/fsh.webm" playsinline autoplay muted loop width="100" alt="Spining low quality fish"></video></td>
          <td><h1>Fsh</h1></td>
        </tr>

    <h2 style="margin-top:-20px">ToDo</h2>
    <dialog id="space_add">
      <button onclick="this.parentElement.close()" class="modal-close">x</button>
      <p id="space_add_text">Create a new space</p>
      <label>Name: <input placeholder="Space name" maxlength="25" id="space_add_name"></label>
      <div class="hsl-selector" id="hsl-selector">
        <div class="hsl-selector-indicator" id="hsl-selector-indicator"></div>
      </div>
      <button onclick="space_del()" id="space_del_button" style="display:none">Delete</button>
      <button onclick="space_act()" id="space_add_button">Create</button>
      <script src="./media/hsl-selector.js" defer></script>
    </dialog>
    <div class="creation">
      <input id="title" placeholder="Title">
      <textarea id="desc" placeholder="Description"></textarea>
      <div>
        <dialog id="timedialog">
          <button onclick="this.parentElement.close()" class="modal-close">x</button>
          <label>Include: <input id="time-include" type="checkbox"></label>
          <hr>
          <label>Date: <input id="time-date" type="datetime-local"></label><br>
          <label>Format: <select id="time-format">
            <option value="t"></option>
            <option value="T"></option>
            <option value="d"></option>
            <option value="D"></option>
            <option value="f"></option>
            <option value="F"></option>
            <option value="s"></option>
            <option value="S"></option>
            <option value="r" style="display:none"></option>
          </select><br>
          <label>Show past date? <input id="time-past" type="checkbox"></label>
        </dialog>

        <div style="flex:1"></div>
        <button onclick="task_add()" class="task-add" aria-label="Create task">Add <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 256 256"><rect x="103" width="50" height="256" rx="25"></rect><rect y="103" width="256" height="50" rx="25"></rect></svg></button>
      </div>
    </div>
    <div id="spaces"></div>
    <div id="toolbar"></div>
    <div id="tasks"></div>
